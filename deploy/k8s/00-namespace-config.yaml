apiVersion: v1
kind: Namespace
metadata:
  name: aiml01
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiml01-api-config
  namespace: aiml01
data:
  APP_ENV: "production"
  DATABASE_URL: "sqlite:////data/fraud_platform.db"
  ARTIFACT_ROOT: "/models"
  # Set to /models/<run_id>/primary after copying a trained artifact into the models volume.
  MODEL_ARTIFACT_DIR: ""
  CORS_ALLOW_ORIGINS: "http://localhost:8080"
  RATE_LIMIT_PREDICT_PER_MIN: "60"
