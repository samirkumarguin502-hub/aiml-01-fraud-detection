# Single replica on purpose: SQLite is a single-writer file and the rate limiter is in-process memory.
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: aiml01, labels: { app: api } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: aiml01-api:local
          imagePullPolicy: Never          # for Minikube: `minikube image load aiml01-api:local`
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: aiml01-api-config } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          livenessProbe: { httpGet: { path: /api/v1/health, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 20 }
          # Readiness is honest: 503 until a valid model is loaded, so the pod stays NotReady without a model.
          readinessProbe: { httpGet: { path: /api/v1/ready, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: models, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: aiml01-data } }
        - { name: models, persistentVolumeClaim: { claimName: aiml01-models } }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: aiml01 }
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000 }]
