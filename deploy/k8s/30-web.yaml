apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: aiml01, labels: { app: web } }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      automountServiceAccountToken: false
      containers:
        - name: web
          image: aiml01-web:local
          imagePullPolicy: Never          # for Minikube: `minikube image load aiml01-web:local`
          ports: [{ containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          readinessProbe: { httpGet: { path: /, port: 8080 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: aiml01 }
spec:
  selector: { app: web }
  ports: [{ port: 8080, targetPort: 8080 }]
