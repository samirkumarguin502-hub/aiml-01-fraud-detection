# CI for AIML-01. Written but NOT executed (no GitHub runner was available when this was authored).
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q backend ml monitoring streaming tests
      - run: python -m pytest -q   # synthetic fixtures only; no dataset is needed or used
  python-xgboost:
    # Exercises the real XGBoost code path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements-dev.txt "xgboost>=2.0"
      - run: python -m pytest -q tests/test_training_pipeline.py
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:lib
      - run: npm run test:components
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aiml01-api:ci .
      - run: docker build -t aiml01-web:ci ./frontend
